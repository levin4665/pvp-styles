name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Bauen
        run: gradle build

      - name: Fertige Mod speichern
        uses: actions/upload-artifact@v4
        with:
          name: pvp-styles-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
